<!DOCTYPE html>

    <link rel="icon" type="image/svg" href="newtab.svg">
    <link rel="stylesheet" type="text/css" id="theme-css" href="style.css">
    <script>document.getElementById('theme-css').href='style.css?v='+Date.now()</script>
    <script>
        (function() {
            var themes = ['mizuki', 'crimson-blood', 'rose-pine', 'gruvbox', 'nord', 'mocha', 'tokyo-night'];
            var last = null;
            try { last = sessionStorage.getItem('jobkitty-theme'); } catch (e) {}
            var pick;
            do {
                pick = themes[Math.floor(Math.random() * themes.length)];
            } while (themes.length > 1 && pick === last);
            document.documentElement.setAttribute('data-theme', pick);
            try { sessionStorage.setItem('jobkitty-theme', pick); } catch (e) {}
        })();
    </script>
    <style>.container { zoom: 1.04; }</style>
</head>

            </div>
            </div>

            <div class="status">

            </div>

    </div>

    <script>
        const bangs = {
            '@yt':   'https://www.youtube.com/results?search_query=',
            '@dd':   'https://duckduckgo.com/?q=',
            '@rd':  'https://www.reddit.com/search/?q=',
            '@ss':   'https://www.startpage.com/sp/search?query=',
            '@brave':'https://search.brave.com/search?q='
        };

        const input = document.getElementById('search-input');

        function getUrl(str) {
            if (str.startsWith('http://') || str.startsWith('https://'))
                return str;
            if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(:[0-9]+)?(\/|$)/.test(str))
                return 'https://' + str;
            if (/^localhost(:[0-9]+)?(\/|$)/.test(str))
                return 'http://' + str;
            return null;
        }

        input.addEventListener('input', function() {
            const q = this.value.trim();
            let match = false;
            for (const bang of Object.keys(bangs)) {
                if (q === bang || q.startsWith(bang + ' ')) {
                    match = true;
                    break;
                }
            }
            this.classList.toggle('bang', match);
        });

        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let query = input.value.trim();
            if (!query) return;

            let url = getUrl(query);
            if (url) {
                window.open(url, '_blank');
                input.value = '';
                input.classList.remove('bang');
                return;
            }

            url = 'https://www.google.com/search?q=' + encodeURIComponent(query);

            for (const [bang, base] of Object.entries(bangs)) {
                if (query.startsWith(bang + ' ') || query === bang) {
                    const rest = query.slice(bang.length).trim();
                    url = rest ? base + encodeURIComponent(rest) : base;
                    break;
                }
            }

            window.open(url, '_blank');
            input.value = '';
            input.classList.remove('bang');
        });

        // live clock in the status bar
        const clockEl = document.getElementById('clock');
        function tickClock() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            clockEl.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }
        tickClock();
        setInterval(tickClock, 1000);

        window.addEventListener('pageshow', function(e) {
            if (!e.persisted) return;
            var themes = ['mizuki', 'crimson-blood', 'rose-pine', 'gruvbox', 'nord', 'mocha', 'tokyo-night'];
            var last = document.documentElement.getAttribute('data-theme');
            var pick;
            do {
                pick = themes[Math.floor(Math.random() * themes.length)];
            } while (themes.length > 1 && pick === last);
            document.documentElement.setAttribute('data-theme', pick);
        });
    </script>
</body>
